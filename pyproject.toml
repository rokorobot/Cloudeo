[project]
name = "cloudeo"
version = "0.1.2.2"
description = "Local-first decision and verification control plane for autonomous agents."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlmodel>=0.0.22",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]
# Optional LongHorizon-Harness integration. Pinned to the exact v0.1.7 source
# commit; see ADR-016 for why this is a Git pin rather than the PyPI release.
longhorizon = [
  "lh-harness @ git+https://github.com/AMAP-ML/LongHorizon-Harness@ff76d6a4c0a4f6d7dfeb2fc2adcf51ccb87a3b9a",
]

[project.scripts]
cloudeo = "cloudeo.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required for the commit-pinned Git dependency in the longhorizon extra.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cloudeo"]
